name: Pages

# Every push, and every morning before the trains start: the schedule the
# browser plays is compiled from UTA's feed at build time.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the engine (SIMD and scalar)
        run: npm run engine
      # The deployed site is the archive: every earlier date it has comes
      # along, with its day file and its sealed sky.
      - name: Compile UTA's schedule, carrying the archive forward
        run: node tools/gtfs/compile.ts --previous https://ampactor.dev/wasatch/schedule
      - name: Seal the finished days' skies
        run: node tools/archive/sky.ts --previous https://ampactor.dev/wasatch/schedule
      - run: npx vite build --config web/vite.config.ts
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # Scheduled workflows stop after 60 days without a commit; the daily
      # schedule must not, so the run re-enables itself.
      - name: Stay scheduled
        if: github.event_name == 'schedule'
        # Never let this block the day's deploy.
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
