name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  site:
    name: Site (types, tests, the sound, a browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build the engine (SIMD and scalar)
        run: npm run engine
      - name: Compile UTA's schedule
        run: npm run gtfs
      - run: npm test
      - name: Theme matches the measured crest
        run: node tools/theme/build.ts --check
      - name: Listen (loudness, true peak, silence, determinism)
        run: node tools/render/check.ts --seconds 75
      - run: npx vite build --config web/vite.config.ts
      - name: Play it in a browser
        run: node tools/e2e/smoke.ts --shots shots --seconds 20
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
