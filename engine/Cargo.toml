[package]
name = "wasatch-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Wasatch Symphony's engine: the valley's data in, music out. One AudioWorklet in the browser; the same binary renders offline."
repository = "https://github.com/ampactor-labs/wasatch"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sonido-core = { git = "https://github.com/ampactor-labs/sonido", branch = "main", default-features = false, features = ["std"] }
sonido-synth = { git = "https://github.com/ampactor-labs/sonido", branch = "main", default-features = false, features = ["std"] }
sonido-effects = { git = "https://github.com/ampactor-labs/sonido", branch = "main", default-features = false, features = ["std"] }
sonido-analysis = { git = "https://github.com/ampactor-labs/sonido", branch = "main" }
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
libm = "0.2"
rustfft = "6"

[dev-dependencies]
hound = "3.5"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
